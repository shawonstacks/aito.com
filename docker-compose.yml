services:
  mongodb:
    image: mongo:latest
    container_name: ecommerce-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./Backend
    container_name: ecommerce-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://admin:secretpassword@mongodb:27017/multivendor_ecommerce?authSource=admin
      - JWT_SECRET=my_super_secret_jwt_key_12345
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://eito.bd/api
    container_name: ecommerce-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://eito.bd/api
    depends_on:
      - backend

volumes:
  mongo_data:
